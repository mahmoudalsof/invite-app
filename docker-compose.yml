# Local development: Postgres runs here, the Go service runs on the host (`make run`).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: invite
      POSTGRES_PASSWORD: invite
      POSTGRES_DB: invite
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invite -d invite"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
